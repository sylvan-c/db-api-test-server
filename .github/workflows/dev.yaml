name: dev CI

on:
  push:
    branches:
      - 'dev'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod tidy

      - name: Run all tests
        run: go test ./...

      - name: Tag build
        run: |
          git tag dev-$(date +%Y%m%d)-$GITHUB_RUN_NUMBER
          git push origin dev-$(date +%Y%m%d)-$GITHUB_RUN_NUMBER

      - name: Auto merge to stable
        run: |
          git fetch origin stable:stable
          git switch stable
          git merge origin/dev --no-ff -m "Merge dev into stable [skip ci]"
        continue-on-error: false  # fail if there are conflicts
      
      - name: Push stable
        run: git push origin stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

