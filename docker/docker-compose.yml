services:
  db:
    image: postgres:16
    container_name: local-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d # Runs all .sql files in ..db/init/ only when docker volume docker_pg_data doesn't exist
  
  go-api:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: go-api
    ports:
      - "${APP_PORT}:8080"
    env_file: .env
    depends_on:
      - db

volumes:
  pg_data: